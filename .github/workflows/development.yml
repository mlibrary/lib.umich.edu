#  Name of workflow
name: Dev workflow

# When workflow is triggered
on:
  workflow_dispatch:

# Jobs to carry out
jobs:
  build:
    # Operating system to run job on
    runs-on: ubuntu-latest
    # Environment to run job on
    environment: development
    # Environment variables
    env:
      DRUPAL_CONCURRENT_FILE_REQUESTS: 20
      DRUPAL_REQUEST_TIMEOUT: 6000000
      DRUPAL_URL: ${{ vars.DRUPAL_URL}}
    # Steps in job
    steps:
      # Get code from repo
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: get short sha
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "DEPLOY_URL=https://deploy-preview-$SHORT_SHA--future-wwwlib-development.netlify.app" >> $GITHUB_ENV
      # Install NodeJS
      - name: Install latest LTS version of Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: lts/*
          check-latest: true
      # Run npm ci (clean-install) and build on our code
      - run: npm ci
      # Enabling cache (must come after `npm ci`, which deletes node_modules first)
      - name: Caching Astro
        id: astro-cache-build
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            dist
            node_modules/.astro
            public/cms-files
          key: ${{ runner.os }}-astro-build-development-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-astro-build-development-
      - run: npm run build
      # Deploy to Netlify using our staging secrets
      - name: Deploy to netlify
        run: npx netlify-cli deploy --dir=dist --alias deploy-preview-${{ env.SHORT_SHA }} --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      - name: Output summary
        run: echo $DEPLOY_URL >> $GITHUB_STEP_SUMMARY
